<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe4">
  <meta name="color-scheme" content="light dark">
  <title>{% if page.title %}{{ page.title }} · {% endif %}Pixels of Clarity</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pixels of Clarity">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/reader.css' | relative_url }}">
  <script src="{{ '/assets/reader.js' | relative_url }}" defer></script>
</head>
<body class="{{ page.page_class | default: 'source-page' }}">
  <a class="skip-link" href="#content">Skip to reading</a>
  <header class="book-bar">
    <a class="book-mark" href="{{ '/' | relative_url }}" aria-label="Pixels of Clarity home">
      <span class="pixel-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span><strong>Pixels of Clarity</strong><small>learning to see structure</small></span>
    </a>
    <nav class="book-nav" aria-label="Book navigation">
      <a href="{{ '/' | relative_url }}#chapters">Chapters</a>
      <a href="{{ '/' | relative_url }}#for-adults">For adults</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
    </nav>
  </header>

  <main id="content" class="page-shell" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p><strong>Pixels of Clarity</strong> is a discovery-based introduction to structureacy.</p>
    <p class="footer-links"><a href="{{ '/' | relative_url }}">Book home</a><a href="https://github.com/TitanicParker/ten-year-old">Source</a></p>
  </footer>
</body>
</html>
